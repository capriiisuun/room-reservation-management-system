{% extends 'app2/base.html' %}
{% block title %}Supprimer Équipement{% endblock %}
{% block content %}
<h1>Supprimer Équipement</h1>
<p>Confirmez-vous la suppression de « {{ equipement.nom }} » (salle : {{ equipement.salle.nom }}) ?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Oui, supprimer</button>
  <a class="btn btn-secondary" href="{% url 'gestion_equipement_list' %}">Annuler</a>
</form>
{% endblock %}
