{% extends 'app2/base.html' %}
{% block title %}Supprimer Réservation{% endblock %}
{% block content %}
<h1>Supprimer Réservation</h1>
<p>Êtes-vous sûr de vouloir supprimer la réservation N°{{ reservation.id }} ?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Oui, supprimer</button>
  <a class="btn btn-secondary" href="{% url 'gestion_reservation_list' %}">Annuler</a>
</form>
{% endblock %}
