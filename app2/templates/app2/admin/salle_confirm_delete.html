{% extends 'app2/base.html' %}
{% block title %}Supprimer Salle{% endblock %}
{% block content %}
<h1>Supprimer Salle</h1>
<p>Êtes-vous sûr de vouloir supprimer « {{ salle.nom }} » ?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Oui, supprimer</button>
  <a class="btn btn-secondary" href="{% url 'gestion_salle_list' %}">Annuler</a>
</form>
{% endblock %}
