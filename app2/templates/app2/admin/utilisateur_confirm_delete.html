{% extends 'app2/base.html' %}
{% block title %}Supprimer utilisateur{% endblock %}
{% block content %}
<h1>Supprimer utilisateur</h1>
<p>Confirmez-vous la suppression de « {{ utilisateur.username }} » ?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Oui, supprimer</button>
  <a class="btn btn-secondary" href="{% url 'gestion_utilisateur_list' %}">Annuler</a>
</form>
{% endblock %}
